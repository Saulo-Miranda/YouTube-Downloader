<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YouTube Downloader</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⬇️</text></svg>">
<style>
  :root {
    --bg: #0f1115;
    --card: #181b22;
    --campo: #22262f;
    --borda: #2c313c;
    --texto: #e8eaf0;
    --suave: #8b93a5;
    --destaque: #ff3b5c;
    --destaque-2: #ff6b3d;
    --ok: #34d399;
    --erro: #f87171;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    min-height: 100vh;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(circle at 20% 0%, #2a1520 0%, var(--bg) 45%);
    color: var(--texto);
    display: flex; justify-content: center; align-items: flex-start;
    padding: 48px 16px;
  }
  main { width: 100%; max-width: 560px; }
  h1 { font-size: 1.6rem; font-weight: 700; margin-bottom: 4px; }
  h1 span {
    background: linear-gradient(90deg, var(--destaque), var(--destaque-2));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .sub { color: var(--suave); margin-bottom: 24px; font-size: .95rem; }
  .card {
    background: var(--card); border: 1px solid var(--borda);
    border-radius: 16px; padding: 20px; margin-bottom: 16px;
    box-shadow: 0 10px 30px rgba(0,0,0,.25);
  }
  .linha { display: flex; gap: 8px; }
  input[type=text], select {
    flex: 1; width: 100%; background: var(--campo); color: var(--texto);
    border: 1px solid var(--borda); border-radius: 10px;
    padding: 12px 14px; font-size: 1rem; outline: none; transition: border-color .15s;
  }
  input[type=text]:focus, select:focus { border-color: var(--destaque); }
  button {
    border: 0; border-radius: 10px; padding: 12px 18px; font-size: 1rem; font-weight: 600;
    cursor: pointer; color: #fff; transition: opacity .15s, transform .05s;
    background: linear-gradient(90deg, var(--destaque), var(--destaque-2));
  }
  button:active { transform: scale(.98); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  button.secundario { background: var(--campo); border: 1px solid var(--borda); }
  .oculto { display: none !important; }

  .preview { display: flex; gap: 14px; align-items: center; }
  .preview img { width: 160px; aspect-ratio: 16/9; object-fit: cover; border-radius: 10px; flex-shrink: 0; }
  .preview h2 { font-size: 1rem; line-height: 1.35; margin-bottom: 6px; }
  .preview p { color: var(--suave); font-size: .88rem; }

  .rotulo { font-size: .8rem; color: var(--suave); text-transform: uppercase; letter-spacing: .05em; margin: 18px 0 8px; }
  .abas { display: grid; grid-template-columns: 1fr 1fr; background: var(--campo); border-radius: 10px; padding: 4px; }
  .abas button { background: transparent; color: var(--suave); padding: 10px; }
  .abas button.ativo { background: var(--card); color: var(--texto); box-shadow: 0 2px 8px rgba(0,0,0,.3); }

  .chave { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 16px; }
  .chave small { display: block; color: var(--suave); font-size: .82rem; margin-top: 2px; }
  .switch { position: relative; width: 44px; height: 24px; flex-shrink: 0; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch span {
    position: absolute; inset: 0; background: var(--campo); border: 1px solid var(--borda);
    border-radius: 99px; cursor: pointer; transition: background .2s;
  }
  .switch span::before {
    content: ""; position: absolute; width: 18px; height: 18px; left: 2px; top: 2px;
    background: #fff; border-radius: 50%; transition: transform .2s;
  }
  .switch input:checked + span { background: var(--destaque); border-color: var(--destaque); }
  .switch input:checked + span::before { transform: translateX(20px); }

  #btnBaixar { width: 100%; margin-top: 22px; padding: 14px; }

  .barra { height: 8px; background: var(--campo); border-radius: 99px; overflow: hidden; margin: 12px 0 8px; }
  .barra div {
    height: 100%; width: 0; border-radius: 99px; transition: width .3s;
    background: linear-gradient(90deg, var(--destaque), var(--destaque-2));
  }
  .barra.indeterminada div { width: 35%; animation: vaivem 1.2s ease-in-out infinite; }
  @keyframes vaivem { 0% { transform: translateX(-100%); } 100% { transform: translateX(300%); } }
  #msg { font-size: .92rem; color: var(--suave); }
  #msg.erro { color: var(--erro); }
  #msg.ok { color: var(--ok); }
  #btnSalvar { margin-top: 14px; width: 100%; }

  .spinner {
    display: inline-block; width: 16px; height: 16px; border: 2px solid rgba(255,255,255,.4);
    border-top-color: #fff; border-radius: 50%; animation: gira .7s linear infinite; vertical-align: -3px;
  }
  @keyframes gira { to { transform: rotate(360deg); } }

  @media (max-width: 480px) {
    .preview { flex-direction: column; align-items: stretch; }
    .preview img { width: 100%; }
  }
</style>
</head>
<body>
<main>
  <h1><span>YouTube</span> Downloader</h1>
  <p class="sub">Cole o link do vídeo, escolha as opções e baixe.</p>

  <div class="card">
    <form id="formBusca" class="linha">
      <input type="text" id="url" placeholder="https://www.youtube.com/watch?v=..." autocomplete="off" required>
      <button type="submit" id="btnBuscar">Buscar</button>
    </form>
    <p id="erroBusca" class="oculto" style="color:var(--erro);margin-top:10px;font-size:.9rem"></p>
  </div>

  <div class="card oculto" id="cardVideo">
    <div class="preview">
      <img id="miniatura" alt="">
      <div>
        <h2 id="titulo"></h2>
        <p id="detalhes"></p>
      </div>
    </div>

    <div class="rotulo">Tipo</div>
    <div class="abas" id="abasTipo">
      <button type="button" data-tipo="video" class="ativo">🎬 Vídeo</button>
      <button type="button" data-tipo="audio">🎵 Somente áudio</button>
    </div>

    <div id="opcoesVideo">
      <div class="rotulo">Qualidade</div>
      <select id="qualidade"></select>
      <label class="chave">
        <div>Modo compatível (H.264)<small>Abre em qualquer player, mas pode limitar a resolução.</small></div>
        <span class="switch"><input type="checkbox" id="h264"><span></span></span>
      </label>
    </div>

    <div id="opcoesAudio" class="oculto">
      <div class="rotulo">Formato</div>
      <select id="formatoAudio">
        <option value="mp3">MP3</option>
        <option value="m4a">M4A (original, sem conversão)</option>
      </select>
    </div>

    <button id="btnBaixar">Baixar</button>
  </div>

  <div class="card oculto" id="cardProgresso">
    <div class="barra" id="barra"><div></div></div>
    <p id="msg"></p>
    <button id="btnSalvar" class="oculto">💾 Salvar arquivo</button>
  </div>
</main>

<script>
const $ = id => document.getElementById(id);
let tipo = "video";
let resolucoes = [];

function formatarDuracao(seg) {
  const h = Math.floor(seg / 3600), m = Math.floor(seg % 3600 / 60), s = seg % 60;
  const p = n => String(n).padStart(2, "0");
  return h ? `${h}:${p(m)}:${p(s)}` : `${m}:${p(s)}`;
}

function preencherQualidades() {
  const h264 = $("h264").checked;
  const sel = $("qualidade");
  const nomes = { 2160: "4K", 1440: "2K", 1080: "Full HD", 720: "HD" };
  sel.innerHTML = `<option value="max">Melhor disponível</option>` +
    resolucoes.map(r => `<option value="${r}">${r}p${nomes[r] ? " · " + nomes[r] : ""}</option>`).join("");
  if (h264 && resolucoes.includes(1080)) sel.value = "1080";
}

$("formBusca").addEventListener("submit", async e => {
  e.preventDefault();
  const btn = $("btnBuscar");
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>';
  $("erroBusca").classList.add("oculto");
  $("cardVideo").classList.add("oculto");
  $("cardProgresso").classList.add("oculto");
  try {
    const r = await fetch("/api/info", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ url: $("url").value })
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.erro);
    $("miniatura").src = d.miniatura;
    $("titulo").textContent = d.titulo;
    $("detalhes").textContent = `${d.autor} · ${formatarDuracao(d.duracao)}`;
    resolucoes = d.resolucoes;
    preencherQualidades();
    $("cardVideo").classList.remove("oculto");
  } catch (err) {
    $("erroBusca").textContent = err.message;
    $("erroBusca").classList.remove("oculto");
  } finally {
    btn.disabled = false; btn.textContent = "Buscar";
  }
});

$("abasTipo").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  tipo = b.dataset.tipo;
  document.querySelectorAll("#abasTipo button").forEach(x => x.classList.toggle("ativo", x === b));
  $("opcoesVideo").classList.toggle("oculto", tipo !== "video");
  $("opcoesAudio").classList.toggle("oculto", tipo !== "audio");
});

$("h264").addEventListener("change", preencherQualidades);

$("btnBaixar").addEventListener("click", async () => {
  const btn = $("btnBaixar");
  btn.disabled = true;
  $("btnSalvar").classList.add("oculto");
  $("cardProgresso").classList.remove("oculto");
  mostrarProgresso("Iniciando...", null);
  try {
    const r = await fetch("/api/baixar", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        url: $("url").value, tipo,
        qualidade: $("qualidade").value,
        h264: $("h264").checked,
        formato_audio: $("formatoAudio").value
      })
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.erro);
    acompanhar(d.id);
  } catch (err) {
    mostrarProgresso(err.message, null, "erro");
    btn.disabled = false;
  }
});

function mostrarProgresso(texto, pct, classe = "") {
  const barra = $("barra");
  barra.classList.toggle("indeterminada", pct == null && classe === "");
  barra.firstElementChild.style.width = pct == null ? "" : pct + "%";
  $("msg").textContent = pct == null || classe ? texto : `${texto} ${pct.toFixed(0)}%`;
  $("msg").className = classe;
}

function acompanhar(id) {
  const timer = setInterval(async () => {
    try {
      const d = await (await fetch(`/api/status/${id}`)).json();
      if (d.status === "concluido") {
        clearInterval(timer);
        mostrarProgresso(`✔ ${d.nome}`, 100, "ok");
        $("btnSalvar").onclick = () => location.href = `/api/arquivo/${id}`;
        $("btnSalvar").classList.remove("oculto");
        $("btnBaixar").disabled = false;
      } else if (d.status === "erro") {
        clearInterval(timer);
        mostrarProgresso(`Erro: ${d.mensagem}`, 0, "erro");
        $("btnBaixar").disabled = false;
      } else {
        mostrarProgresso(d.mensagem, d.progresso);
      }
    } catch { /* servidor ocupado; tenta de novo no próximo ciclo */ }
  }, 500);
}
</script>
</body>
</html>
